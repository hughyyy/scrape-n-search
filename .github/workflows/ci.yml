name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e mcp-server[dev]
      - name: Run tests
        run: python -m pytest mcp-server/tests -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e mcp-server[dev]
      - name: Lint
        run: ruff check --config mcp-server/pyproject.toml mcp-server/src mcp-server/tests scripts
      - name: Type check
        run: mypy
        working-directory: mcp-server
      - name: Branch coverage (100% required)
        run: |
          cd mcp-server
          coverage run -m pytest tests -q
          coverage report -m
      - name: Shell lint
        run: shellcheck install.sh setup.sh
