name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # needed for PyPI trusted publishing

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e mcp-server[dev]
      - name: Run tests
        run: python -m pytest mcp-server/tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        working-directory: mcp-server
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --generate-notes --title "$GITHUB_REF_NAME"

  publish:
    # Publishes to PyPI via trusted publishing (no token). Until the publisher
    # is configured in PyPI admin for this repository/workflow, this job fails
    # with a clear OIDC error — the GitHub release above is unaffected.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
