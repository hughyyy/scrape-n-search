[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrape-n-search-mcp"
version = "0.2.0"
description = "MCP server unifying web-search and scraping providers behind a few agent tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]
keywords = ["mcp", "web-scraping", "search", "scraping", "agent", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/hughyyy/scrape-n-search"
Repository = "https://github.com/hughyyy/scrape-n-search"
Documentation = "https://github.com/hughyyy/scrape-n-search/blob/main/README.md"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "coverage[toml]",
  "ruff",
  "mypy",
]

[project.scripts]
scrape-n-search = "scrape_n_search.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrape_n_search = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120

[tool.coverage.run]
branch = true
source = ["scrape_n_search"]

[tool.coverage.report]
show_missing = true
fail_under = 100
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/scrape_n_search"]
ignore_missing_imports = true
warn_unused_ignores = true
