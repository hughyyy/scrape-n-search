[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrape-n-search-mcp"
version = "0.1.0"
description = "MCP server unifying web-search and scraping providers behind a few agent tools"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
scrape-n-search = "scrape_n_search.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
